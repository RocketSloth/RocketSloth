name: Engineering telemetry
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/telemetry.mjs
      - .github/workflows/metrics.yml
permissions:
  contents: write
concurrency:
  group: engineering-telemetry
  cancel-in-progress: false
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate aggregate telemetry
        run: node scripts/telemetry.mjs
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit telemetry when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh engineering telemetry [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

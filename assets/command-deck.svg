<g font-family="Consolas, monospace"><text x="42" y="52" fill="#56dcf2" font-size="12" letter-spacing="3">RS / ORBITAL ENGINEERING</text><text x="918" y="52" fill="#eab35a" text-anchor="end" font-size="11">INDEPENDENT BUILDER</text>

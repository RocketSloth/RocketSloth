<text x="43" y="195" fill="#56dcf2" font-size="18" letter-spacing="3">BUILD. AUTOMATE. EXPLORE.</text>
<text x="43" y="228" fill="#b0c2cf" font-size="13">Practical systems. Curious engineering.</text>
<text x="43" y="249" fill="#b0c2cf" font-size="13">Slow and steady — then escape velocity.</text>
